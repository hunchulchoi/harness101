[project]
name = "harness101"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness101"]
